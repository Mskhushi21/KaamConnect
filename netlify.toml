[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  BUN_VERSION = "1.3.12"

# The Express API is not part of this static deployment. Keep API failures
# as errors so the React app never mistakes its HTML shell for JSON data.
[[redirects]]
  from = "/api/*"
  to = "/api-unavailable.json"
  status = 404

# Let React Router handle direct links and browser refreshes. Existing files
# (including Vite's hashed assets) keep their normal static-file handling.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
